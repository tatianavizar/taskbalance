# Unassigned, so the Chores it spawns skip Chore#at_least_one_load_dimension.
smith_weekly_laundry:
  household: smith_home
  task: do_laundry
  frequency: 1
  mental_load: false
  execution_load: true
  active: true

# Assigned but with neither load dimension set: RecurringChore has no validation
# forbidding this, but Chore does, so generate_next cannot build a valid Chore.
# Exists to prove a scheduler failure never costs the user their log.
smith_broken_template:
  household: smith_home
  task: cook_meal
  assigned_to: bob
  frequency: 0
  mental_load: false
  execution_load: false
  active: true
