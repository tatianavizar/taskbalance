# XcodeGen spec (https://github.com/yonaskolb/XcodeGen): `xcodegen generate`
# in native/ios writes FiftyFifty.xcodeproj (not committed). See native/README.md.
name: FiftyFifty
options:
  bundleIdPrefix: app.cinquante
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fr

packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    from: 1.2.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  FiftyFifty:
    type: application
    platform: iOS
    sources:
      - path: FiftyFifty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cinquante.mobile
        PRODUCT_NAME: "50-50"
        INFOPLIST_FILE: FiftyFifty/Info.plist
        CODE_SIGN_ENTITLEMENTS: FiftyFifty/FiftyFifty.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # PLACEHOLDER: your 10-character Apple team id
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0" # Swift 5 language mode (no strict concurrency)
        # Read by AppConfig through Info.plist.
        BASE_URL: "https://cinquante.app"
      configs:
        Debug:
          BASE_URL: "http://localhost:3000"
    dependencies:
      - package: HotwireNative
      - package: Firebase
        product: FirebaseMessaging
