            one: "Le foyer est au niveau %{level}, à %{count} semaine équilibrée du niveau %{next}."
            other: "Le foyer est au niveau %{level}, à %{count} semaines équilibrées du niveau %{next}."
          stays:
            one: "Le foyer reste au niveau %{level}, à %{count} semaine équilibrée du niveau %{next}."
            other: "Le foyer reste au niveau %{level}, à %{count} semaines équilibrées du niveau %{next}."
        details:
          mental: "Charge mentale"
          execution: "Exécution"
          time: "Temps"

      reengagement:
        title: "Aucune tâche enregistrée la semaine %{week} dans %{household}."
        line: "50/50 garde la trace des tâches du foyer, en charge mentale comme en exécution. Vous pouvez reprendre quand vous voulez."

      alert_no_logs:
        subject:
          self: "Semaine %{week} close : vous n'avez enregistré aucune tâche"
          other: "Semaine %{week} close : %{name} n'a enregistré aucune tâche"
        title:
          self: "Vous n'avez enregistré aucune tâche cette semaine"
          other: "%{name} n'a enregistré aucune tâche cette semaine"
        range: "Du %{from} au %{to}."
        pause: "Une absence ? Déclarez une pause."
        counts: "Tâches enregistrées en semaine %{week} : %{counts}."
        heading:
          self: "Vos tâches enregistrées"
          other: "Tâches enregistrées par %{name}"
        logs:
          zero: "Aucune tâche"
          one: "%{count} tâche"
          other: "%{count} tâches"

      alert_blocked:
        down:
          self: "Le foyer redescend au niveau %{level} : vous n'avez rien enregistré depuis %{weeks} semaines"
          other: "Le foyer redescend au niveau %{level} : %{name} n'a rien enregistré depuis %{weeks} semaines"
        held:
          self: "La progression du foyer est bloquée : vous n'avez rien enregistré depuis %{weeks} semaines"
          other: "La progression du foyer est bloquée : %{name} n'a rien enregistré depuis %{weeks} semaines"
        range: "Du %{from} au %{to}."
        unblock: "Pour débloquer : une semaine où chaque membre enregistre au moins une tâche."

      alert_unblocked:
        title: "Progression débloquée."
        everyone: "Chaque membre a enregistré des tâches en semaine %{week}."
        outcome:
          balanced: "La semaine est aussi équilibrée : elle compte pour le niveau %{level}."
          balanced_top: "La semaine est aussi équilibrée : elle compte."
          unbalanced: "La semaine n'est pas équilibrée : elle ne compte pas."
        streak: "Le compte des semaines sans enregistrement repart de zéro."

      alert_block_lifted:
        title: "La progression du foyer est débloquée"
        level: "Le foyer reste au niveau %{level}."
        counts: "Les semaines équilibrées comptent de nouveau pour monter de niveau."
        keep: "Une absence à venir ? Déclarez une pause."

      absence_question:
        title:
          self: "Semaine %{week} close : vous n'avez rien enregistré depuis 2 semaines"
          other: "Semaine %{week} close : %{name} n'a rien enregistré depuis 2 semaines"
        ask:
          self: "Une absence ? Répondez avant %{deadline}."
          other: "Absence de %{name} ? Répondez avant %{deadline}."
        rule: "La question est posée à tout le foyer. Un seul « Oui » suffit. Sans « Oui » avant %{deadline}, le foyer redescend d'un niveau et la progression est bloquée."

      absence_outcome:
        paused:
          title:
            self: "Une pause est déclarée pour vous. %{range}"
            other: "Une pause est déclarée pour %{name}. %{range}"
          line:
            self: "Le foyer ne redescend pas d'un niveau."
            other: "Le foyer ne redescend pas d'un niveau."
        cancelled:
          title:
            self: "La descente de niveau est annulée."
            other: "La descente de niveau est annulée."
          line:
            self: "Une pause couvre vos semaines sans enregistrement. Le niveau et le compte de semaines équilibrées sont rétablis, la progression est débloquée."
            other: "Une pause couvre les semaines sans enregistrement de %{name}. Le niveau et le compte de semaines équilibrées sont rétablis, la progression est débloquée."

      pause_declared:
        title:
          self: "Pause déclarée pour vous. %{range}"
          other: "Pause déclarée pour %{name}. %{range}"
        line: "Une semaine de pause ne compte pas dans le bilan du foyer."

      task_assigned:
        title: "%{name} vous a assigné une tâche : %{chore}."
        due: "À faire pour le %{date}."

      task_offered:
        title: "%{name} vous propose une tâche : %{chore}."
        line: "Pour la semaine %{week} seulement. Si vous acceptez, elle est prévue dans votre charge mentale cette semaine ; la répartition validée ne change pas."

      task_offer_answered:
        accepted: "%{name} prend « %{chore} » cette semaine."
        refused: "%{name} ne prend pas « %{chore} » cette semaine."

      monday_split:
        title: "La répartition de la semaine %{week} est prête."
        counts: "Tâches prévues : %{counts}."

      gap_reset:
        title: "L'écart de la semaine %{week} est remis à zéro."

      household_ready:
        title: "C'est prêt : %{household} a choisi ses tâches."
        line: "Vos préférences et la répartition vous attendent."

      household_deleted:
        title: "%{name} a supprimé le foyer « %{household} »."
        journal: "Votre journal vous suit : vos enregistrements restent dans votre compte."
        next: "Pour continuer, créez un foyer ou ouvrez une nouvelle invitation."
