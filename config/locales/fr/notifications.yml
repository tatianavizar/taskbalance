    messages:
      weekly_report:
        subject:
          neutral: "Semaine %{week} : semaine neutre"
          shares: "Semaine %{week} : %{shares} de la charge mentale"
        headline:
          balanced: "Semaine équilibrée."
          unbalanced: "Semaine déséquilibrée."
          neutral: "Semaine neutre."
          carrier:
            self:
              mental: "Vous portez %{share} % de la charge mentale."
              execution: "Vous portez %{share} % de l'exécution."
            other:
              mental: "%{name} porte %{share} % de la charge mentale."
              execution: "%{name} porte %{share} % de l'exécution."
        streak:
          zero: ""
          one: ", comme la précédente"
          other: ", comme les %{count} précédentes"
        verdict:
          balanced: "Bilan provisoire. La semaine est équilibrée : chaque membre reste entre %{min} et %{max} %, en charge mentale comme en exécution."
          above: "Bilan provisoire. Au-dessus de %{max} % : la semaine n'est pas équilibrée%{streak}."
          outside: "Bilan provisoire. Hors de la zone de %{min} à %{max} % : la semaine n'est pas équilibrée%{streak}."
          neutral:
            too_few_active_members: "Bilan provisoire. Il faut au moins 2 membres actifs : la semaine ne compte pas."
            member_arrived: "Bilan provisoire. Un membre est arrivé en cours de semaine : elle ne compte pas."
            no_mental_logs: "Bilan provisoire. Aucune charge mentale enregistrée : la semaine ne compte pas."
            no_execution_logs: "Bilan provisoire. Aucune exécution enregistrée : la semaine ne compte pas."
            pause_declared: "Bilan provisoire. Une pause déclarée après coup rend la semaine neutre."
        level:
          blocked: "La progression est bloquée : une semaine où chaque membre enregistre au moins une tâche la débloque."
          ultimate: "Le foyer est au niveau ultime."
