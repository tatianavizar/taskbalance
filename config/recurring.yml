# The weekly engine acts, for each household, on the moments that have passed
# in that household's time zone: provisional report from Sunday 20:00, final
# report from Monday 03:00, absence deadline on Wednesday 20:00. Every step is
# idempotent and missed weeks are caught up in order, so a stopped worker loses
# nothing.
#
# Fan-out: these two recurring jobs are only dispatchers. Every 15 minutes
# (which covers zones offset by :30 or :45, Asia/Kolkata, Asia/Kathmandu) they
# select the households that have something due (households.engine_due_at,
# households.chores_scheduled_week: see EngineCycle and
# RecurringChoreScheduler) and enqueue one job each on the `engine` queue,
# processed by the workers of config/queue.yml. When nothing is due, nothing
# is enqueued.
#
# Development uses the async adapter (no Solid Queue tables): run everything
# inline and by hand with `bin/rails runner WeeklyEngineJob.perform_now` and
# `bin/rails runner RecurringChoreSchedulerJob.perform_now`.
production:
  weekly_engine:
    class: EngineDispatchJob
    queue: default
    schedule: every 15 minutes
  # Writes each household's occurrences for the week that has begun in its own
  # time zone (lot 4). Idempotent; a chore also schedules itself when saved.
  recurring_chore_scheduler:
    class: ChoreSchedulerDispatchJob
    queue: default
    schedule: every 15 minutes
  # Rails 8 default: finished jobs are kept for SolidQueue's
  # clear_finished_jobs_after (1 day), then removed in batches.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
