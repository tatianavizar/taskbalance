# The weekly engine runs every 15 minutes and acts, for each household, on the
# moments that have passed in that household's time zone: provisional report
# from Sunday 20:00, final report from Monday 03:00, absence deadline on
# Wednesday 20:00. Every step is idempotent and missed weeks are caught up in
# order, so a stopped worker loses nothing. 15 minutes covers zones offset by
# :30 or :45 (Asia/Kolkata, Asia/Kathmandu).
#
# Development uses the async adapter (no Solid Queue tables): run the engine by
# hand with `bin/rails runner WeeklyEngineJob.perform_now`.
production:
  weekly_engine:
    class: WeeklyEngineJob
    queue: default
    schedule: every 15 minutes
  # Writes each household's occurrences for the week that has begun in its own
  # time zone (lot 4). Idempotent; a chore also schedules itself when saved.
  recurring_chore_scheduler:
    class: RecurringChoreSchedulerJob
    queue: default
    schedule: every 15 minutes
  # Rails 8 default: finished jobs are kept for SolidQueue's
  # clear_finished_jobs_after (1 day), then removed in batches.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
