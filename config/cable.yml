development:
  adapter: async

test:
  adapter: test

# Solid Cable: broadcasts go through the cable database (config/database.yml),
# no Redis needed. Lot 4 relies on it for the live home and Tasks tab.
production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
